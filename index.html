<style>
:root{

header h1{font-family:'Playfair Display',Georgia,serif;font-size:19px;margin:0;letter-spacing:.2px}
header .sub{font-size:11.5px;color:var(--muted);margin-top:2px}
nav{display:flex;gap:4px;flex-wrap:wrap;padding:8px 18px;background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:66px;z-index:19}
nav button{border:1px solid transparent;background:transparent;color:var(--muted);padding:7px 12px;border-radius:8px;font-size:13px;cursor:pointer;font-weight:600}
nav button.on{background:var(--label);color:var(--goldD);border-color:var(--gold)}
.commrow{display:flex;gap:6px;padding:10px 18px;background:var(--label);border-bottom:1px solid var(--line);flex-wrap:wrap;align-items:center}
.chip{border:1px solid var(--line);background:#fff;padding:5px 12px;border-radius:999px;font-size:12.5px;cursor:pointer;color:var(--muted)}
.chip.on{background:var(--head);color:#fff;border-color:var(--head)}
main{padding:18px;max-width:1180px;margin:0 auto}
.grid{display:grid;gap:14px}
.g4{grid-template-columns:repeat(4,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g2{grid-template-columns:repeat(2,1fr)}
@media(max-width:900px){.g4{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:1fr 1fr}.g2{grid-template-columns:1fr}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px}
.kpi b{display:block;font-size:26px;color:var(--head)}
.kpi span{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}
h2{font-family:'Playfair Display',Georgia,serif;font-size:17px;margin:0 0 10px;border-bottom:2px solid var(--gold);padding-bottom:6px}
.plist{display:grid;gap:10px}
.prow{border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:flex;justify-content:space-between;align-items:center;gap:10px;cursor:pointer;background:#fff}
.prow:hover{border-color:var(--gold)}
.prow .nm{font-weight:700}
.prow .meta{font-size:12px;color:var(--muted)}
.pill{padding:3px 9px;border-radius:999px;font-size:11px;font-weight:700}
.p-active{background:#E7F3EC;color:var(--ok)}.p-approved{background:#EAF2E9;color:var(--ok)}
.p-revise{background:#FBEAE8;color:var(--bad)}.p-hold{background:#EFEAF6;color:var(--holdc)}
.p-pending{background:#FBF3E1;color:var(--warn)}
label{font-size:12px;font-weight:700;color:var(--muted);display:block;margin:10px 0 4px}
input,select,textarea{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:8px;font-size:13.5px;font-family:inherit;background:#fff}
textarea{min-height:90px;resize:vertical}
.btn{border:1px solid var(--gold);background:var(--gold);color:#fff;padding:9px 14px;border-radius:8px;font-size:13px;font-weight:700;cursor:pointer}
.btn.ghost{background:#fff;color:var(--goldD)}
.btn.small{padding:5px 10px;font-size:12px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{border:1px solid var(--line);padding:7px 9px;text-align:left}
th{background:var(--head);color:#fff;font-size:11.5px;text-transform:uppercase}
.label-cell{background:var(--label);font-weight:700;width:150px}
.photog{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px;margin-top:8px}
.photog img{width:100%;height:90px;object-fit:cover;border-radius:6px;border:1px solid var(--line)}
.overlay{position:fixed;inset:0;background:rgba(30,28,24,.5);display:flex;align-items:center;justify-content:center;z-index:50;padding:20px}
.modal{background:#fff;border-radius:12px;max-width:640px;width:100%;max-height:88vh;overflow:auto;padding:20px}
.close{float:right;border:none;background:transparent;font-size:20px;cursor:pointer;color:var(--muted)}
.tag{font-size:11px;color:#fff;background:var(--gold);padding:2px 8px;border-radius:999px}
.empty{text-align:center;padding:40px;color:var(--muted)}
.sig{font-family:'Brush Script MT',cursive;font-size:26px;color:var(--goldD)}

.checklist-item{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);padding:8px 0}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:8px;font-size:13px;display:none;z-index:60}

/* ---------- storage (IndexedDB -> localStorage -> in-memory fallback chain) ---------- */
const DB_NAME='fmg_console_v6', DB_VER=2;
const STORES=['projects','reports','inspections','issues','contacts','photos','officenotes'];
let DB, STORAGE_MODE='idb';
const MEM={};
STORES.forEach(s=>MEM[s]=[]);
function openDB(){return new Promise((res,rej)=>{
  try{
    const r=indexedDB.open(DB_NAME,DB_VER);
    r.onupgradeneeded=e=>{const db=e.target.result;STORES.forEach(s=>{if(!db.objectStoreNames.contains(s))db.createObjectStore(s,{keyPath:'id'});});};
    r.onsuccess=e=>{DB=e.target.result;res(DB);};
    r.onerror=()=>rej(r.error);
    r.onblocked=()=>rej(new Error('IndexedDB blocked'));
  }catch(e){rej(e);}
});}
function lsAvailable(){try{const k='__fmg_test__';localStorage.setItem(k,'1');localStorage.removeItem(k);return true;}catch(e){return false;}}
function lsKey(store){return 'fmgls_'+store;}
function lsGetAll(store){try{return JSON.parse(localStorage.getItem(lsKey(store))||'[]');}catch(e){return [];}}
function lsSetAll(store,arr){try{localStorage.setItem(lsKey(store),JSON.stringify(arr));}catch(e){STORAGE_MODE='mem';MEM[store]=arr;}}
function txStore(name,mode='readonly'){return DB.transaction(name,mode).objectStore(name);}
function idbAll(store){
  if(STORAGE_MODE==='mem') return Promise.resolve(MEM[store]);
  if(STORAGE_MODE==='ls') return Promise.resolve(lsGetAll(store));
  return new Promise((res,rej)=>{const r=txStore(store).getAll();r.onsuccess=()=>res(r.result||[]);r.onerror=()=>rej(r.error);});
}
function idbPut(store,obj){
  if(STORAGE_MODE==='mem'){const i=MEM[store].findIndex(x=>x.id===obj.id);if(i>=0)MEM[store][i]=obj;else MEM[store].push(obj);return Promise.resolve(obj);}
  if(STORAGE_MODE==='ls'){const arr=lsGetAll(store);const i=arr.findIndex(x=>x.id===obj.id);if(i>=0)arr[i]=obj;else arr.push(obj);lsSetAll(store,arr);return Promise.resolve(obj);}
  return new Promise((res,rej)=>{const r=txStore(store,'readwrite').put(obj);r.onsuccess=()=>res(obj);r.onerror=()=>rej(r.error);});
}
function idbDel(store,id){
  if(STORAGE_MODE==='mem'){MEM[store]=MEM[store].filter(x=>x.id!==id);return Promise.resolve();}
  if(STORAGE_MODE==='ls'){const arr=lsGetAll(store).filter(x=>x.id!==id);lsSetAll(store,arr);return Promise.resolve();}
  return new Promise((res,rej)=>{const r=txStore(store,'readwrite').delete(id);r.onsuccess=()=>res();r.onerror=()=>rej(r.error);});
}

async function syncKnownRecords(){
  const now=new Date().toISOString();
  for(const rec of KNOWN_UPDATES){
    const existing=S.projects.find(p=>String(p.community)===rec.community && String(p.number)===rec.number);
    if(existing){
      const merged={...existing,...rec,updatedAt:now};
      await idbPut('projects',merged);
    }else{
      await idbPut('projects',{id:uid(),createdAt:now,updatedAt:now,photos:[],needsVisit:false,community:rec.community,number:rec.number,owner:'',architect:'',status:'active',arbStatus:'',bond:'',bondNote:'',scopeType:'',completion:0,statusHeadline:'',nextStep:'',fieldNotes:'',reportNo:'',...rec});
    }
  }
  S.projects=await idbAll('projects');
}

/* ---------- boot ---------- */
async function boot(){
  try{
    try{ await openDB(); STORAGE_MODE='idb'; }
    catch(e){
      STORAGE_MODE = lsAvailable() ? 'ls' : 'mem';
      console.warn('IndexedDB unavailable, using '+STORAGE_MODE+' fallback:',e);
    }
    for(const s of STORES){S[s]=await idbAll(s);}
    if(S.projects.length===0){
      const seed=seedData();
      for(const s of STORES){for(const rec of seed[s]){await idbPut(s,rec);}}
      for(const s of STORES){S[s]=await idbAll(s);}
    }
    await syncKnownRecords();
    if(STORAGE_MODE==='mem'){
      const banner=document.createElement('div');
      banner.style.cssText='background:#FBF3E1;color:#8f7220;padding:8px 18px;font-size:12px;text-align:center;border-bottom:1px solid var(--gold)';
      banner.textContent='Preview mode — storage is blocked in this view, so nothing you add here will be saved. Open the file in a real browser tab or on the deployed site to keep changes.';
      document.body.insertBefore(banner, document.body.firstChild);
    }
    render();
  }catch(err){
    document.getElementById('main').innerHTML=`<div class="card"><h2>Something went wrong loading the console</h2><p style="color:var(--muted)">${esc(err&&err.message||err)}</p><p style="font-size:12px;color:var(--muted2)">If you opened this file directly (file://...), try uploading it to GitHub Pages instead — some browsers block local storage for files opened this way.</p></div>`;
    console.error(err);
  }
}

    const g=k=>document.getElementById('c_'+k).value;
    const rec={id:uid(),name:g('name'),role:g('role'),community:g('community'),phone:g('phone'),email:g('email')};
    await idbPut('contacts',rec); await saveAll('contacts'); App.close(); render(); toast('Contact saved.');
  },
  renderChecklistFor(pid){document.getElementById('chk_body').innerHTML=pid?checklistBody(pid):'';},
  async toggleChecklist(pid,i){
    const p=S.projects.find(x=>x.id===pid);
    const items=p.checklist||DEFAULT_CHECKLIST.map(t=>({t,done:false}));
    items[i].done=!items[i].done; p.checklist=items; p.updatedAt=new Date().toISOString();
    await idbPut('projects',p); await saveAll('projects');
    document.getElementById('chk_body').innerHTML=checklistBody(pid);
  },
  buildDraft(){
    const pid=document.getElementById('gen_project').value;
    const type=document.getElementById('gen_type').value;
    const p=S.projects.find(x=>x.id===pid); if(!p)return;
    let text;
    if(type==='email'){
      text=`Subject: ${p.projectName} — Status Update\n\nHello,\n\nStatus update on ${p.projectName} (${p.community}):\n\n${p.statusHeadline||'No headline set.'}\n\nField notes: ${p.fieldNotes||'—'}\n\nNext step: ${p.nextStep||'—'}\n\nBest,\nFrances M. González Casalduc\nFMG On-Site`;
    } else {
      text=`${p.projectName} (${p.community}) update: ${p.statusHeadline||'—'}. Next step: ${p.nextStep||'—'}. — Frances, FMG On-Site`;
    }
    document.getElementById('gen_out').innerHTML=`<textarea style="min-height:180px">${esc(text)}</textarea><div class="row" style="margin-top:8px"><button class="btn small" onclick="navigator.clipboard.writeText(document.querySelector('#gen_out textarea').value);toast('Copied.')">Copy</button></div>`;
  },
  async exportBackup(){
    const data={}; for(const s of STORES){data[s]=S[s];}
    const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
    const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='fmg-onsite-backup-'+new Date().toISOString().slice(0,10)+'.json'; a.click();
  }
};

boot();
</script>
</body>
</html>
